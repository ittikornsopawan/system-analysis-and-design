name: checks

# Only the checks that protect something real (owner order of 2026-11-20). The other check_docs.py sub-commands pin
# wording of single specs; authors may run them locally, CI does not. run_db_tests.sh stays local (owner order 2026-11-15).
# Nothing here uses a secret: the job only reads the repository (permissions: contents: read).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The contract is what the backend and the frontend build against: it must be valid OpenAPI 3.1.
      - name: Contract is valid OpenAPI
        run: |
          python3 -m pip install --quiet openapi-spec-validator==0.9.0
          python3 -m openapi_spec_validator e-commerce/api/api-contract.json

      # Every spec SQL names real tables and columns.
      - name: Spec SQL matches the schema
        if: ${{ !cancelled() }}
        run: python3 e-commerce/db/tests/audit_all.py

      # Source checks only (no draw.io): a migration or schema doc that changes without a diagram refresh fails here.
      - name: Diagram generators (--check)
        if: ${{ !cancelled() }}
        run: |
          python3 -B e-commerce/scripts/diagrams/generate_domain_diagrams.py --check
          python3 -B e-commerce/scripts/diagrams/generate_layered_diagrams.py --check

      - name: test_sequence_skeleton.py
        if: ${{ !cancelled() }}
        run: |
          for c in biz-codes status-codes api-sequence-spec schema er md-frontmatter; do
            python3 e-commerce/db/tests/check_docs.py "$c"
          done

      - name: Tooling tests
        if: ${{ !cancelled() }}
        run: |
          python3 .agents/skills/api-contract-design/scripts/test_sequence_skeleton.py
          python3 .agents/skills/agent-workspace/tests/test_agent_workspace.py

name: checks

# Only the checks that protect something real (owner order of 2026-11-20). The other check_docs.py sub-commands pin
# wording of single specs; authors may run them locally, CI does not. run_db_tests.sh stays local (owner order 2026-11-15).
# Nothing here uses a secret: the job only reads the repository (permissions: contents: read).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The contract is what the backend and the frontend build against: it must be valid OpenAPI 3.1.
      - name: Contract is valid OpenAPI
        run: |
          python3 -m pip install --quiet openapi-spec-validator==0.9.0
          python3 -m openapi_spec_validator e-commerce/api/api-contract.json

      # Every spec SQL names real tables and columns.
      - name: Spec SQL matches the schema
        if: ${{ !cancelled() }}
        run: python3 e-commerce/db/tests/audit_all.py

      # One bizCode per HTTP status, sequence SQL equal to spec SQL, schema docs and ER equal to the migrations,
      # frontmatter on every document, no spec rule line cut with "...".
      - name: Codes, SQL parity, schema and ER
        if: ${{ !cancelled() }}
        run: |
          for c in biz-codes status-codes api-sequence-spec schema er md-frontmatter no-cut-rules; do
            python3 e-commerce/db/tests/check_docs.py "$c"
          done

      # Diagrams equal their generator sources and the domain inventory equals the migrations; no draw.io needed.
      - name: Diagram generators (--check)
        if: ${{ !cancelled() }}
        run: |
          python3 -B e-commerce/scripts/diagrams/generate_domain_diagrams.py --check
          python3 -B e-commerce/scripts/diagrams/generate_layered_diagrams.py --check

      - name: Tooling tests
        if: ${{ !cancelled() }}
        run: |
          python3 .agents/skills/api-contract-design/scripts/test_sequence_skeleton.py
          python3 .agents/skills/agent-workspace/tests/test_agent_workspace.py

      # .claude/skills holds copies of the ready skills so Claude Code's Skill tool can load them; .agents/skills is the
      # source. Every copy must equal its source, and every ready skill must have a copy. Not copied: evals/ (the
      # `claude plugin eval` suites stay with the source) and __pycache__ (made by the tooling tests above).
      - name: Claude skill copies equal .agents/skills
        if: ${{ !cancelled() }}
        run: |
          for d in .claude/skills/*/; do n=$(basename "$d"); diff -r -x evals -x __pycache__ ".agents/skills/$n" ".claude/skills/$n"; done
          for n in $(grep -oE '^\| `skills/[a-z-]+/SKILL.md` \| ready' .agents/README.md | cut -d/ -f2); do
            test -f ".claude/skills/$n/SKILL.md" || { echo "missing copy: .claude/skills/$n"; exit 1; }
          done

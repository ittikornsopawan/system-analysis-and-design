<text x="40" y="964" font-size="10" font-family="Geist,Arial,sans-serif" font-weight="400" fill="#4f5d75" text-anchor="start">Header nesting shows ownership. Each lifeline is one interaction boundary; child boxes are structural context, not extra timings.</text>
<text x="40" y="988" font-size="10" font-family="Geist,Arial,sans-serif" font-weight="400" fill="#4f5d75" text-anchor="start">PROPOSED at-least-once delivery. MongoDB marker, projection and audit commit together; SQL ACK is a separate transaction.</text>
<text x="40" y="1008" font-size="10" font-family="Geist,Arial,sans-serif" font-weight="400" fill="#4f5d75" text-anchor="start">Same-ID/same-hash replay never repeats checkout or stock/budget work. Quarantine needs operator review before controlled replay.</text>

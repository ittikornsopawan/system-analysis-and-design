<text x="40" y="176" font-size="12" font-family="Geist,Arial,sans-serif" font-weight="400" fill="#4f5d75" text-anchor="start">Read transitions as event + guard + effect. Payment and parcel statuses are separate entities.</text>

<text x="824" y="848" font-size="11" font-family="Geist,Arial,sans-serif" font-weight="400" fill="#4f5d75" text-anchor="start">Payment attempts and parcels have separate statuses.</text>
